<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1720" viewBox="0 0 1240 1720" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #000; stroke-width: 1.6; }
      .dash { fill: #fff; stroke: #000; stroke-width: 1.6; stroke-dasharray: 7 5; }
      .t { font-size: 21px; font-weight: 700; fill: #000; }
      .d { font-size: 19px; fill: #000; }
      .m { font-family: Menlo, monospace; font-size: 17px; }
      .ln { stroke: #000; stroke-width: 1.6; fill: none; }
      .dl { stroke: #000; stroke-width: 1.6; fill: none; stroke-dasharray: 7 5; }
      .tag { fill: #fff; stroke: #000; stroke-width: 1.2; }
      .tagt { font-size: 19px; font-weight: 700; fill: #8a6d1c; letter-spacing: 0.5px; }
      .gl { stroke: #2e7d32; stroke-width: 1.6; stroke-dasharray: 6 5; fill: none; }
      .gt { font-size: 18px; font-weight: 700; fill: #2e7d32; }
    </style>
  </defs>
  <rect width="1240" height="1720" fill="#fff"/>

  <text x="40" y="48" font-size="26" font-weight="700">Photo → stone outlines → Grasshopper</text>
  <text x="40" y="78" class="d" fill="#555">Filling the gap between the Python detection and Rhino / Grasshopper</text>

  <!-- tags -->
  <rect class="tag" x="40" y="120" width="120" height="30"/>
  <text x="50" y="142" class="tagt">PYTHON</text>

  <!-- 1 photo -->
  <rect class="box" x="360" y="120" width="520" height="100" rx="8"/>
  <text x="380" y="153" class="t">1. Top-view photo</text>
  <text x="380" y="180" class="d">Phone straight above the stones (JPEG)</text>
  <text x="380" y="204" class="d">e.g. photos/01_L0_AB.jpeg</text>
  <line class="ln" x1="620" y1="220" x2="620" y2="268" marker-end="url(#a)"/>

  <!-- later: live -->
  <rect class="dash" x="40" y="170" width="270" height="100" rx="8"/>
  <text x="58" y="203" class="t" font-size="19">Later: live video</text>
  <text x="58" y="230" class="d">frames while the phone</text>
  <text x="58" y="254" class="d">moves (detection upgrade)</text>
  <line class="dl" x1="310" y1="200" x2="358" y2="170" marker-end="url(#a)"/>

  <!-- 2 detect -->
  <rect class="box" x="360" y="270" width="520" height="100" rx="8"/>
  <text x="380" y="303" class="t">2. Detect stones</text>
  <text x="380" y="330" class="d">Mode 1 <tspan class="m">stone_detect.py</tspan>: Canny + watershed</text>
  <text x="380" y="354" class="d">→ one outline per stone, in pixels</text>
  <line class="ln" x1="620" y1="370" x2="620" y2="418" marker-end="url(#a)"/>

  <!-- 3 json -->
  <rect class="box" x="360" y="420" width="520" height="100" rx="8"/>
  <text x="380" y="453" class="t">3. Write <tspan class="m" font-size="20">stones.json</tspan></text>
  <text x="380" y="480" class="d"><tspan class="m">photo_to_json.py</tspan>: pixels → cm (--ref-cm),</text>
  <text x="380" y="504" class="d">y flipped to point up, area per stone</text>

  <!-- divider -->
  <line x1="40" y1="560" x2="1200" y2="560" stroke="#999" stroke-width="1.2" stroke-dasharray="3 5"/>
  <line class="ln" x1="620" y1="520" x2="620" y2="598" marker-end="url(#a)"/>
  <rect class="tag" x="40" y="580" width="170" height="30"/>
  <text x="50" y="602" class="tagt">GRASSHOPPER</text>

  <!-- inputs -->
  <rect class="box" x="40" y="630" width="270" height="100" rx="8"/>
  <text x="58" y="664" class="d"><tspan class="m">json_path</tspan> ← Panel</text>
  <text x="58" y="688" class="d" fill="#444">“stones.json”</text>
  <text x="58" y="714" class="d"><tspan class="m">refresh</tspan> ← Button</text>
  <line class="ln" x1="310" y1="680" x2="358" y2="680" marker-end="url(#a)"/>

  <!-- 4 read -->
  <rect class="box" x="360" y="600" width="520" height="130" rx="8"/>
  <text x="380" y="633" class="t">4. Read the file (Python 3 Script)</text>
  <text x="380" y="660" class="d m">receive_contours.py</text>
  <text x="380" y="686" class="d">points → closed polyline per stone,</text>
  <text x="380" y="710" class="d">area recomputed in Grasshopper</text>

  <!-- outputs -->
  <line class="ln" x1="620" y1="730" x2="620" y2="770"/>
  <line class="ln" x1="210" y1="770" x2="1030" y2="770"/>
  <line class="ln" x1="210" y1="770" x2="210" y2="828" marker-end="url(#a)"/>
  <line class="ln" x1="620" y1="770" x2="620" y2="828" marker-end="url(#a)"/>
  <line class="ln" x1="1030" y1="770" x2="1030" y2="828" marker-end="url(#a)"/>
  <rect class="tag" x="40" y="782" width="140" height="30"/>
  <text x="50" y="804" class="tagt">OUTPUTS</text>

  <rect class="box" x="40" y="830" width="340" height="100" rx="8"/>
  <text x="58" y="863" class="t m" font-size="20">contours</text>
  <text x="58" y="890" class="d">The stone outlines, drawn</text>
  <text x="58" y="914" class="d">in the Rhino viewport</text>

  <rect class="box" x="450" y="830" width="340" height="100" rx="8"/>
  <text x="468" y="863" class="t m" font-size="20">centroids</text>
  <text x="468" y="890" class="d">One point per stone</text>
  <text x="468" y="914" class="d">(for placing / labels later)</text>

  <rect class="box" x="860" y="830" width="340" height="100" rx="8"/>
  <text x="878" y="863" class="t"><tspan class="m" font-size="20">info</tspan> → Panel</text>
  <text x="878" y="890" class="d m">stone 0: area GH 928.3</text>
  <text x="878" y="914" class="d m">/ Python 928.3 (same)</text>

  <!-- merge -->
  <line class="ln" x1="1030" y1="930" x2="1030" y2="970"/>
  <line class="ln" x1="620" y1="970" x2="1030" y2="970"/>
  <line class="ln" x1="620" y1="930" x2="620" y2="1008" marker-end="url(#a)"/>

  <!-- 5 diamond -->
  <polygon class="box" points="620,1010 880,1100 620,1190 360,1100"/>
  <text x="620" y="1094" class="t" text-anchor="middle">5. Areas in Grasshopper</text>
  <text x="620" y="1120" class="t" text-anchor="middle">= areas in Python?</text>

  <!-- No loop -->
  <polyline class="gl" points="880,1100 1215,1100 1215,470 882,470" marker-end="url(#g)"/>
  <text x="895" y="1135" class="gt">No: outline lost or changed</text>
  <text x="895" y="1159" class="gt">on the way, check the file</text>

  <!-- Yes -->
  <line class="ln" x1="620" y1="1190" x2="620" y2="1278" marker-end="url(#a)"/>
  <text x="635" y="1240" class="t" font-size="19">Yes: the stones arrived</text>

  <!-- 6 -->
  <rect class="dash" x="360" y="1280" width="520" height="100" rx="8"/>
  <text x="380" y="1313" class="t">6. Convert for the phone (next step)</text>
  <text x="380" y="1340" class="d">Curve → points or a thin mesh</text>
  <text x="380" y="1364" class="d">(Payload Prep skips curves)</text>
  <line class="ln" x1="620" y1="1380" x2="620" y2="1428" marker-end="url(#a)"/>

  <!-- 7 -->
  <rect class="dash" x="360" y="1430" width="520" height="100" rx="8"/>
  <text x="380" y="1463" class="t">7. Send to the phone (later)</text>
  <text x="380" y="1490" class="d">Geometry Payload Prep → MQTT</text>
  <text x="380" y="1514" class="d">→ COMPAS XR</text>

  <!-- legend -->
  <rect class="box" x="40" y="1620" width="44" height="26" rx="4"/>
  <text x="96" y="1640" class="d">built, tested on a real photo in Rhino 8 + Grasshopper</text>
  <rect class="dash" x="640" y="1620" width="44" height="26" rx="4"/>
  <text x="696" y="1640" class="d">not built yet</text>
</svg>
